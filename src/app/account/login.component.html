<div class="card-header bg-danger text-white p-4 text-center rounded-top">
    <h2 class="fw-bold mb-1"><i class="bi bi-bag-heart-fill me-2"></i>kaonline</h2>
    <p class="mb-0 small text-white-50">Online Food Delivery System - Sign In</p>
</div>
<div class="card-body p-4">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="text" formControlName="email" class="form-control form-control-lg" placeholder="name@kaonline.com" [ngClass]="{ 'is-invalid': submitted && f.email.errors }" />
            <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                <div *ngIf="f.email.errors.required">Email is required</div>
                <div *ngIf="f.email.errors.email">Email is invalid</div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" formControlName="password" class="form-control form-control-lg" placeholder="••••••••" [ngClass]="{ 'is-invalid': submitted && f.password.errors }" />
            <div *ngIf="submitted && f.password.errors" class="invalid-feedback">
                <div *ngIf="f.password.errors.required">Password is required</div>
            </div>
        </div>
        <div class="d-grid mb-3">
            <button [disabled]="submitting" class="btn btn-danger btn-lg fw-bold shadow-sm">
                <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2"></span>
                <i *ngIf="!submitting" class="bi bi-box-arrow-in-right me-1"></i> Sign In to KaOnline
            </button>
        </div>
        <div class="mb-3 text-center">
            <small class="text-muted d-block mb-2">⚡ Quick Demo Sign In:</small>
            <div class="btn-group btn-group-sm w-100" role="group">
                <button type="button" class="btn btn-outline-danger" (click)="loginAsDemo('Customer')">Customer</button>
                <button type="button" class="btn btn-outline-danger" (click)="loginAsDemo('Restaurant')">Restaurant</button>
                <button type="button" class="btn btn-outline-danger" (click)="loginAsDemo('Rider')">Rider</button>
                <button type="button" class="btn btn-outline-danger" (click)="loginAsDemo('Admin')">Admin</button>
            </div>
        </div>
        <div class="d-flex justify-content-between align-items-center border-top pt-3">
            <a routerLink="../register" class="text-danger text-decoration-none fw-semibold">Don't have an account? Register</a>
            <a routerLink="../forgot-password" class="text-muted small text-decoration-none">Forgot Password?</a>
        </div>
    </form>
</div>
